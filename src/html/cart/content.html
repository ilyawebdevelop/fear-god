<section class="sect pt-0">
  <div class="container">
    <div class="cartW">
      <div class="cartContent">
        <ul class="cartList">

          <li class="cartItem">

            <a href="#" class="cartItemImg">
              <img src="@img/admin/product/image-1.jpg" alt="image">
            </a>

            <div class="cartItemContent">
              <div class="cartItemContentTop">
                <a href="#" class="cartItemTitle">Лонгслив Fear of God Essentials</a>
                <a href="#" class="cartItemRemove">
                  <img src="@img/icons/close.svg" alt="icon">
                </a>
              </div>
              <div class="cartItemContentBottom">

                <div class="cartItemVariations">
                  <div class="fw-light fz-15">
                    Черный / M
                  </div>
                </div>

                <div class="cartItemAction">

                  <div class="cartItemQuantity">
                    <button onclick="this.nextElementSibling.querySelector('input').stepDown();">-</button>
                    <div class="quantity-input">
                      <input type="number" value="3" min="1">
                    </div>
                    <button onclick="this.previousElementSibling.querySelector('input').stepUp();">+</button>
                  </div>

                  <div class="cartItemPrice">
                    <span class="fz-15">12 990 ₽</span>
                    <span class="fz-13 fw-light color-75 line-trough">14 900 ₽</span>
                  </div>
                </div>

              </div>
            </div>
          </li>

          <li class="cartItem">

            <a href="#" class="cartItemImg">
              <img src="@img/admin/product/image-2.jpg" alt="image">
            </a>

            <div class="cartItemContent">
              <div class="cartItemContentTop">
                <a href="#" class="cartItemTitle">Футболка FOG Essentials</a>
                <a href="#" class="cartItemRemove">
                  <img src="@img/icons/close.svg" alt="icon">
                </a>
              </div>
              <div class="cartItemContentBottom">

                <div class="cartItemVariations">
                  <div class="fw-light fz-15">
                    Белый / L
                  </div>
                </div>

                <div class="cartItemAction">

                  <div class="cartItemQuantity">
                    <button onclick="this.nextElementSibling.querySelector('input').stepDown();">-</button>
                    <div class="quantity-input">
                      <input type="number" value="1" min="1">
                    </div>
                    <button onclick="this.previousElementSibling.querySelector('input').stepUp();">+</button>
                  </div>

                  <div class="cartItemPrice">
                    <span class="fz-15">8 900 ₽</span>
                  </div>
                </div>

              </div>
            </div>
          </li>

        </ul>

        <div class="promoW">
          <input type="text" placeholder="Введите промокод">
          <button class="promoBtn">
            <img src="@img/icons/btn-arrow-white.svg" alt="icon">
          </button>
        </div>

      </div>
      <div class="cartOrder">
        <h3 class="h3 text-center mb-30">
          Информация о заказе
        </h3>

        <div class="cartOrderRows">
          <div class="cartOrderRow">
            <span class="fw-light fz-15">Всего товаров</span>
            <span class="fz-15">2 товара</span>
          </div>
          <div class="cartOrderRow">
            <span class="fw-light fz-15">Сумма заказа</span>
            <span class="fz-15">5 820 ₽</span>
          </div>
          <div class="cartOrderRow">
            <span class="fw-light fz-15">Скидка</span>
            <span class="fz-15">- 390 ₽</span>
          </div>
          <div class="cartOrderRow">
            <span class="fw-light fz-15">МОЙ ПРОМОКОД</span>
            <div class="d-flex align-items-center gap-15">
              <span class="fz-15">- 1 000 ₽</span>
              <a href="#">
                <img src="@img/icons/close.svg" alt="icon">
              </a>
            </div>
          </div>
          <div class="cartOrderRow">
            <span class="fz-18">Итоговая сумма</span>
            <span class="fz-18">5 220 ₽</span>
          </div>
        </div>


        <button class="button button--black w-100">
          ПЕРЕЙТИ К ОФОРМЛЕНИЮ
        </button>

      </div>
    </div>
  </div>
</section>
