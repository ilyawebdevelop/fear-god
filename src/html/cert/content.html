<section class="sect certSect">
  <div class="container">
    <div class="max-w-1230 mx-auto">

      <div class="certStep mb-45">
        <div class="mb-5 text-center color-75 ls-005 text-uppercase">
          Шаг 1
        </div>
        <div class="fz-28 text-center mb-30">
          Выберите номинал
        </div>

        <div class="nominalGrid mb-30">

          <div class="radioW">
            <input id="nominal_1" type="radio" name="nominal" checked>
            <label class="d-flex align-items-center gap-10" for="nominal_1">
              <span>10 000 ₽</span>
            </label>
          </div>

          <div class="radioW">
            <input id="nominal_2" type="radio" name="nominal">
            <label class="d-flex align-items-center gap-10" for="nominal_2">
              <span>15 000 ₽</span>
            </label>
          </div>
          <div class="radioW">
            <input id="nominal_3" type="radio" name="nominal">
            <label class="d-flex align-items-center gap-10" for="nominal_3">
              <span>15 000 ₽</span>
            </label>
          </div>
          <div class="radioW">
            <input id="nominal_4" type="radio" name="nominal">
            <label class="d-flex align-items-center gap-10" for="nominal_4">
              <span>30 000 ₽</span>
            </label>
          </div>
          <div class="radioW">
            <input id="nominal_5" type="radio" name="nominal">
            <label class="d-flex align-items-center gap-10" for="nominal_5">
              <span>100 000 ₽</span>
            </label>
          </div>
        </div>

        <div class="certNomSum">
          <div class="inputW">
            <label class="color-75 mb-10 d-block fz-15 fw-light" for="certNomSum">Или укажите сумму сертификата</label>
            <input type="text" class="formInput" id="certNomSum">
          </div>
        </div>
      </div>

      <div class="certStep mb-45">
        <div class="mb-5 text-center color-75 ls-005 text-uppercase">
          Шаг 2
        </div>
        <div class="fz-28 text-center mb-30">
          Заполните данные получателя сертификата (кому дарите)
        </div>

        <div class="d-grid grid-cols-3 gap-10">
          <div class="inputW">
            <label class="color-75 mb-10 d-block fz-15 fw-light" for="name-whom">Имя, фамилия*</label>
            <input id="name-whom" name="name-whom" type="text" class="formInput">
          </div>
          <div class="inputW">
            <label class="color-75 mb-10 d-block fz-15 fw-light" for="tel-whom">Номер телефона*</label>
            <input id="tel-whom" name="tel-whom" type="tel" class="formInput" placeholder="+7 (___) ___-__-__">
          </div>
          <div class="inputW">
            <label class="color-75 mb-10 d-block fz-15 fw-light" for="email-whom">E-mail*</label>
            <input id="email-whom" name="email-whom" type="email" class="formInput">
          </div>
        </div>


      </div>

      <div class="certStep mb-45">
        <div class="mb-5 text-center color-75 ls-005 text-uppercase">
          Шаг 3
        </div>
        <div class="fz-28 text-center mb-30">
          Заполните контактные данные (от кого подарок)
        </div>

        <div class="d-grid grid-cols-3 mb-20 gap-10">
          <div class="inputW">
            <label class="color-75 mb-10 d-block fz-15 fw-light" for="name-send">От кого / Подпись</label>
            <input id="name-send" name="name-send" type="text" class="formInput">
          </div>
          <div class="inputW">
            <label class="color-75 mb-10 d-block fz-15 fw-light" for="tel-send">Номер телефона отправителя</label>
            <input id="tel-send" name="tel-send" type="tel" class="formInput" placeholder="+7 (___) ___-__-__">
          </div>
          <div class="inputW">
            <label class="color-75 mb-10 d-block fz-15 fw-light" for="email-send">E-mail отправителя</label>
            <input id="email-send" name="email-send" type="email" class="formInput">
          </div>
        </div>

        <div class="inputW">
          <label class="color-75 mb-10 d-block fz-15 fw-light" for="text-send">Текст послания</label>
          <textarea name="text-send" id="text-send" class="formText h-110 w-100"></textarea>
        </div>

      </div>

      <div class="max-w-400 mx-auto">
        <div class="agreement mb-20">
          <input id="news_agree_1" type="checkbox">
          <label for="news_agree_1">
            <div class="rect"></div>
            <div class="agreementText">
              Я соглашаюсь с условиями <a class="hover-opacity" href="#">Политики конфиденциальности</a> и <a
                class="hover-opacity" href="#">Политики обработки персональных данных</a>
            </div>
          </label>
        </div>
        <button class="checkout-btn button button--black w-100 text-uppercase mb-40">
          Отправить
        </button>

        <div class="d-flex align-items-center flex-column gap-10">
          <a class="text-center fw-light fz-15 link-border" href="#">Правила продажи и обращения электронных подарочных сертификатов</a>
          <a class="text-center fw-light fz-15 link-border" href="#">Политика конфиденциальности</a>
          <a class="text-center fw-light fz-15 link-border" href="#">Наши реквизиты</a>
        </div>

      </div>

    </div>
  </div>
</section>
